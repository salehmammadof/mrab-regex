name: Fuzz regex (continuous)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch previous progress
        run: |
          mkdir -p corpus artifacts
          git fetch origin fuzz-data:refs/remotes/origin/fuzz-data 2>/dev/null || true
          if git rev-parse --verify origin/fuzz-data >/dev/null 2>&1; then
            git checkout origin/fuzz-data -- corpus artifacts redos_log.jsonl 2>/dev/null || true
            git reset HEAD . 2>/dev/null || true
          fi

      - name: Install clang and build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          pip install --upgrade pip setuptools wheel atheris

      - name: Build regex with ASan
        run: |
          CC=clang CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g -O1" \
          LDSHARED="clang -shared -fsanitize=address" \
          python setup.py build_ext --inplace

      - name: Run fuzz campaign
        continue-on-error: true
        run: |
          export ASAN_OPTIONS=detect_leaks=0
          export REGEX_MODE=match
          PRELOAD=$(clang -print-file-name=libclang_rt.asan-x86_64.so)
          timeout 19800 bash -c '
            while true; do
              LD_PRELOAD="'"$PRELOAD"'" python fuzz_regex.py corpus/ \
                -max_len=256 -timeout=20 -artifact_prefix=./artifacts/ \
                >> fuzz.log 2>&1
              sleep 1
            done
          ' || true

      - name: Save progress back to fuzz-data branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "fuzz-bot"
          git config user.email "fuzz-bot@users.noreply.github.com"
          
          mkdir -p /tmp/fuzz_export
          [ -d corpus ] && cp -r corpus /tmp/fuzz_export/ 2>/dev/null || true
          [ -d artifacts ] && cp -r artifacts /tmp/fuzz_export/ 2>/dev/null || true
          [ -f redos_log.jsonl ] && cp redos_log.jsonl /tmp/fuzz_export/ 2>/dev/null || true
          [ -f fuzz.log ] && cp fuzz.log /tmp/fuzz_export/ 2>/dev/null || true

          git fetch origin fuzz-data:fuzz-data 2>/dev/null || git checkout --orphan fuzz-data
          git checkout fuzz-data
          git rm -rf . 2>/dev/null || true
          
          cp -r /tmp/fuzz_export/* . 2>/dev/null || true
          
          git add -A
          git commit -m "fuzz progress $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git fuzz-data --force
