name: Fuzz regex
on:
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
        
      - name: Install atheris
        run: pip install atheris
        
      - name: Build regex with ASan
        run: |
          CC=clang CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g -O1" \
          LDSHARED="clang -shared -fsanitize=address" \
          pip install -e . --no-build-isolation
          
      - name: Run fuzz campaign
        continue-on-error: true
        run: |
          export ASAN_OPTIONS=detect_leaks=0
          export REGEX_MODE=match
          PRELOAD=$(clang -print-file-name=libclang_rt.asan-x86_64.so)
          mkdir -p corpus artifacts
          timeout 20000 bash -c '
            while true; do
              LD_PRELOAD="'"$PRELOAD"'" python fuzz_regex.py corpus/ \
                -max_len=256 -timeout=20 -artifact_prefix=./artifacts/ \
                >> fuzz.log 2>&1
              sleep 1
            done
          '
          
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results
          path: |
            artifacts/
            redos_log.jsonl
            fuzz.log
