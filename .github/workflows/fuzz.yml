name: Fuzz regex (continuous)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch previous progress
        run: |
          mkdir -p corpus artifacts
          if git ls-remote --exit-code --heads origin fuzz-data; then
            git fetch origin fuzz-data
            git checkout origin/fuzz-data -- corpus/ artifacts/ redos_log.jsonl 2>/dev/null || true
            git checkout ${{ github.sha }} -- .github/
          fi

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install atheris
        run: pip install atheris

      - name: Build regex with ASan
        run: |
          CC=clang CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g -O1" \
          LDSHARED="clang -shared -fsanitize=address" \
          pip install -e . --no-build-isolation

      - name: Run fuzz campaign
        continue-on-error: true
        run: |
          export ASAN_OPTIONS=detect_leaks=0
          export REGEX_MODE=match
          PRELOAD=$(clang -print-file-name=libclang_rt.asan-x86_64.so)
          timeout 19800 bash -c '
            while true; do
              LD_PRELOAD="'"$PRELOAD"'" python fuzz_regex.py corpus/ \
                -max_len=256 -timeout=20 -artifact_prefix=./artifacts/ \
                >> fuzz.log 2>&1
              sleep 1
            done
          ' || true

      - name: Save progress back to fuzz-data branch
        if: always()
        run: |
          git config user.name "fuzz-bot"
          git config user.email "fuzz-bot@users.noreply.github.com"
          
          WORKDIR=$(mktemp -d)
          cd $WORKDIR
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo
          cd repo
          
          git checkout --orphan fuzz-data 2>/dev/null || git checkout fuzz-data
          git rm -rf . 2>/dev/null || true
          
          [ -d $GITHUB_WORKSPACE/corpus ] && cp -r $GITHUB_WORKSPACE/corpus . || mkdir corpus
          [ -d $GITHUB_WORKSPACE/artifacts ] && cp -r $GITHUB_WORKSPACE/artifacts . || mkdir artifacts
          [ -f $GITHUB_WORKSPACE/redos_log.jsonl ] && cp $GITHUB_WORKSPACE/redos_log.jsonl . || true
          [ -f $GITHUB_WORKSPACE/fuzz.log ] && cp $GITHUB_WORKSPACE/fuzz.log . || true
          
          git add -A
          git commit -m "fuzz progress $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git push origin fuzz-data --force
